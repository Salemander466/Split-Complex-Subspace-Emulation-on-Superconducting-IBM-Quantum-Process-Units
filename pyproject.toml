[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperbolic-subspace-quantum-cryptography"
version = "0.1.0"
description = "Reproducible split-complex subspace validation circuits for IBM Quantum hardware."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later OR Commercial" }
authors = [{ name = "Jacob Lie" }]
dependencies = [
    "numpy>=1.24",
    "qiskit>=1.0",
    "qiskit-ibm-runtime>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
hscq-build = "hscq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
